# Self-host in one command: `docker compose up`. Postgres holds proposals, approvals, receipts,
# and checkpoints. Put keys in a local .env (copy .env.example); compose passes it as environment.
services:
  api:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://paid_media:paid_media@postgres:5432/paid_media
      PAID_MEDIA_RUNTIME: self_hosted
      # The image must listen on all interfaces; a local .env usually says 127.0.0.1.
      PAID_MEDIA_API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - workspace:/app/workspace
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paid_media
      POSTGRES_PASSWORD: paid_media
      POSTGRES_DB: paid_media
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paid_media"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  workspace:
  pgdata:
