name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format check
        run: uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen mypy src
      - name: Offline tests
        run: uv run --frozen pytest -q
      - name: Fixture demo
        run: uv run --frozen paid-media-agent demo --with-proposal
      - name: MDA definition import smoke
        run: uv run --frozen python -c "import agent; print(agent.agent.config['name'])"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts=--all \
            --redact=100 --ignore-gitleaks-allow --no-banner --no-color
