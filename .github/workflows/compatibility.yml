name: compatibility

# Weekly check that the fast-moving framework dependencies still satisfy the offline contract.
# It never commits: a failure is a signal to review the upgrade, not to auto-merge it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgraded-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Resolve the newest compatible versions
        run: uv lock --upgrade
      - name: Show what changed
        run: git --no-pager diff --stat uv.lock
      - name: Install and test with the upgraded lock
        run: |
          uv sync --all-extras --dev
          uv run ruff check .
          uv run mypy src
          uv run pytest -q
          uv run paid-media-agent demo
