<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paid Media Agent · Setup</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="desk">
    <div class="shell" id="shell">
      <aside class="rail" aria-label="Setup routes">
        <div class="masthead">
          <span class="mark-tile" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" width="28" height="28">
              <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" class="mark-bg"/>
              <g transform="translate(5 5) scale(0.188034188)" class="mark-ink">
                <path d="M36.5535 77.5437C43.4064 70.6905 47.2587 61.3855 47.2587 51.6947C47.2587 42.0038 43.4031 32.6988 36.5535 25.8457L10.7052 0C3.85561 6.85314 0 16.1581 0 25.849C0 35.5399 3.85561 44.8448 10.7052 51.698L36.5502 77.5437H36.5535Z"/>
                <path d="M90.6385 79.9355C83.7889 73.0857 74.4808 69.23 64.7936 69.23C55.1063 69.23 45.7983 73.0857 38.9453 79.9355L64.7936 105.785C71.6432 112.634 80.9512 116.49 90.6418 116.49C100.332 116.49 109.637 112.634 116.49 105.785L90.6418 79.9355H90.6385Z"/>
                <path d="M10.7681 105.724C17.6211 112.574 26.9258 116.43 36.6164 116.43V79.8755H0.0595703C0.062897 89.5664 3.91518 98.8713 10.7681 105.724Z"/>
                <path d="M100.618 41.718C93.7653 34.8682 84.4606 31.0091 74.7667 31.0125C65.0761 31.0125 55.7714 34.8682 48.9185 41.7213L74.7667 67.5703L100.618 41.718Z"/>
              </g>
            </svg>
          </span>
          <div class="masthead-text">
            <div class="masthead-title">Paid Media Agent</div>
            <div class="masthead-sub">Setup console · local only</div>
          </div>
        </div>
        <nav class="rail-nav" id="rail-nav"></nav>
        <div class="rail-foot">
          <button class="btn btn-ghost btn-compact" id="theme-toggle" type="button" aria-label="Toggle theme">Dark theme</button>
          <button class="btn btn-ghost btn-compact" id="refresh" type="button">Refresh</button>
        </div>
      </aside>
      <main class="canvas" id="canvas">
        <div class="page-band">
          <div>
            <h1 class="page-title" id="page-title">Loading</h1>
            <p class="page-tagline" id="page-tagline"></p>
          </div>
          <div class="page-actions" id="page-actions"></div>
        </div>
        <p class="page-desc" id="page-desc"></p>
        <div id="banner" class="banner" hidden></div>
        <section class="steps" id="steps" aria-live="polite"></section>
        <section class="processes" id="processes"></section>
      </main>
    </div>
    <p class="desk-foot">Everything on this page is a CLI command. Hover a step for the equivalent. The page never shows secret values.</p>
  </div>
  <template id="tpl-step">
    <article class="step" data-step="">
      <button class="step-head" type="button" aria-expanded="false">
        <span class="step-status" data-status=""><span class="dot" aria-hidden="true"></span><span class="step-status-text"></span></span>
        <span class="step-main">
          <span class="step-title"></span>
          <span class="step-desc"></span>
        </span>
        <span class="step-side">
          <span class="badge badge-quiet step-note" hidden></span>
          <span class="chev" aria-hidden="true">›</span>
        </span>
      </button>
      <div class="step-body" hidden>
        <div class="step-cli"><span class="caps">CLI</span><code class="mono"></code><button class="btn btn-ghost btn-compact copy" type="button">Copy</button></div>
        <div class="step-action"></div>
        <div class="step-result" hidden></div>
      </div>
    </article>
  </template>
  <script src="/static/app.js"></script>
</body>
</html>
