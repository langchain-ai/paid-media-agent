<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paid Media Agent · Setup</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="desk">
    <header class="topbar">
      <div class="brand">
        <span class="mark-tile" id="brand-mark" aria-hidden="true"></span>
        <span class="brand-copy">
          <span class="brand-name">Paid Media Agent</span>
          <span class="brand-kicker">Local setup</span>
        </span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-compact" id="view-toggle" type="button">Advanced</button>
        <button class="btn btn-ghost btn-compact" id="theme-toggle" type="button" aria-label="Toggle theme">Dark</button>
      </div>
    </header>

    <main class="stage" id="wizard">
      <section class="frame">
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>
        <nav class="meter" id="progress" aria-label="Setup progress"></nav>
        <section class="screen" id="screen" aria-live="polite"></section>
      </section>
    </main>

    <div class="shell" id="advanced" hidden>
      <aside class="rail" aria-label="Setup routes"><nav class="rail-nav" id="rail-nav"></nav></aside>
      <div class="canvas" id="canvas">
        <div class="page-band">
          <div><h1 class="page-title" id="page-title">Loading</h1><p class="page-tagline" id="page-tagline"></p></div>
          <div class="page-actions" id="page-actions"></div>
        </div>
        <p class="page-desc" id="page-desc"></p>
        <div id="banner" class="banner" hidden></div>
        <section class="steps" id="steps"></section>
        <section class="processes" id="processes"></section>
      </div>
    </div>

    <p class="desk-foot" id="foot">127.0.0.1 only · secrets stay in .env · every action here has a CLI equivalent</p>
  </div>

  <template id="tpl-step">
    <article class="step" data-step="">
      <button class="step-head" type="button" aria-expanded="false">
        <span class="step-status" data-status=""><span class="dot" aria-hidden="true"></span><span class="step-status-text"></span></span>
        <span class="step-main"><span class="step-title"></span><span class="step-desc"></span></span>
        <span class="step-side"><span class="badge badge-quiet step-note" hidden></span><span class="chev" aria-hidden="true">›</span></span>
      </button>
      <div class="step-body" hidden>
        <div class="step-cli"><span class="caps">CLI</span><code class="mono"></code><button class="btn btn-ghost btn-compact copy" type="button">Copy</button></div>
        <div class="step-action"></div>
        <div class="step-result" hidden></div>
      </div>
    </article>
  </template>
  <script src="/static/logos.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
