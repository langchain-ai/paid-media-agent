# Socket Mode requires an app-level token with connections:write.
display_information:
  name: Paid Media Agent
  description: Analyze campaigns and report on your connected ad accounts.
features:
  agent_view:
    agent_description: Analyze campaign performance, compare periods, and create paid-media reports.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Paid Media Agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - assistant:write
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    # Set request_url only for the signed HTTP transport.
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
