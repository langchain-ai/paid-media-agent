# Slack app manifest for the rich adapter. Socket Mode needs an app-level token with
# connections:write; the signed HTTP transport needs the request URL instead.
display_information:
  name: Paid Media Agent
  description: Analyzes connected ad accounts and stages changes for human approval.
features:
  bot_user:
    display_name: Paid Media Agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - files:write
settings:
  event_subscriptions:
    # Set request_url only for the signed HTTP transport.
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
